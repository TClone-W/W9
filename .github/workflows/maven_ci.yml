name: Maven CI - Multi-OS Matrix

# Trigger workflow khi có push hoặc pull request lên branch chính
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# Cho phép workflow ghi file (required cho upload-artifact)
permissions:
  contents: read

jobs:
  build:
    name: Build & Test (${{ matrix.os }})

    # Matrix Strategy: chạy trên 3 hệ điều hành
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      # Bước 1: Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Bước 2: Setup JDK 11
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # Bước 3: Cache Maven packages
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ matrix.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ matrix.os }}-maven-

      # Bước 4: Build project (compile + test + package)
      - name: Build with Maven
        run: mvn clean package

      # Bước 5: Upload JAR artifact
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: bank-system-jar-${{ matrix.os }}
          path: target/maven-lab-01-1.0-SNAPSHOT.jar
          retention-days: 7