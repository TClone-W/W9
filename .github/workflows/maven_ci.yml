name: Maven CI

# Trigger workflow khi có push hoặc pull request lên branch chính
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# Cho phép workflow ghi file (required cho upload-artifact)
permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Bước 2: Setup JDK 11
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      # Bước 3: Cache Maven packages
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Bước 4: Build project (compile + test + package)
      - name: Build with Maven
        run: mvn clean package

      # Bước 5: Upload JAR artifact
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: bank-system-jar
          path: target/maven-lab-01-1.0-SNAPSHOT.jar
          retention-days: 7

      # Bước 6: Display test summary
      - name: Test Summary
        if: always()
        run: |
          echo "=== CI Build Complete ==="
          echo "Workflow: ${{ github.workflow }}"
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref }}"
          echo "Status: Success"